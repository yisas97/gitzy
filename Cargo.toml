[package]
name = "guit"
version = "0.1.0"
edition = "2021"
description = "Cliente Git TUI minimalista con soporte para AI"
authors = ["Tu Nombre"]
license = "MIT"
repository = "https://github.com/tu-usuario/guit"
keywords = ["git", "tui", "terminal", "cli"]
